<style>
  :root{
    --bg:#090c10; --surface:#10141b; --surface-2:#161c26;
    --line:#1f2833; --line-soft:#161d26;
    --copper:#ff8f4d; --phosphor:#4ee6a8; --blueprint:#5eb3ff;
    --text:#e8edf3; --muted:#8592a1; --dim:#606d7d;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --sans:'IBM Plex Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);font-family:var(--sans);
    min-height:100vh;display:flex;flex-direction:column;
    overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; animation-iteration-count:1 !important;}
  }

  .grid-bg{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(var(--line-soft) 1px, transparent 1px),linear-gradient(90deg, var(--line-soft) 1px, transparent 1px);
    background-size:48px 48px;opacity:.14;
    mask-image:radial-gradient(ellipse 60% 50% at 50% 40%, black 30%, transparent 85%);
  }

  main{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:32px;position:relative;z-index:1;
  }

  .mark{
    width:56px;height:56px;border-radius:12px;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;position:relative;margin-bottom:36px;
  }
  .mark span{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--text);}
  .mark i{position:absolute;top:9px;right:9px;width:6px;height:6px;background:var(--phosphor);border-radius:1px;box-shadow:0 0 8px var(--phosphor);}

  .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--copper);display:flex;align-items:center;gap:10px;margin-bottom:22px;
  }
  .eyebrow::before, .eyebrow::after{content:'';width:16px;height:1px;background:var(--copper);}

  h1{
    font-family:var(--mono);font-weight:600;letter-spacing:-0.01em;
    font-size:clamp(28px,5vw,46px);line-height:1.2;max-width:680px;margin-bottom:18px;
  }
  h1 .accent{color:var(--phosphor);}

  p.sub{color:var(--muted);font-size:16px;max-width:460px;margin-bottom:40px;line-height:1.6;}

  .status{
    font-family:var(--mono);font-size:12px;color:var(--dim);
    display:flex;align-items:center;gap:8px;margin-bottom:44px;
  }
  .live-dot{width:6px;height:6px;border-radius:50%;background:var(--phosphor);box-shadow:0 0 6px var(--phosphor);animation:pulse 1.6s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

  .contact{
    display:flex;gap:14px;flex-wrap:wrap;justify-content:center;
  }
  .btn{
    font-family:var(--mono);font-size:13px;font-weight:600;
    padding:12px 22px;border-radius:2px;text-decoration:none;
    display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
  }
  .btn-primary{background:var(--copper);color:#0a0a0a;}
  .btn-primary:hover{background:#ffa568;}
  .btn-ghost{border:1px solid var(--line);color:var(--text);}
  .btn-ghost:hover{border-color:var(--muted);}
  .btn:focus-visible{outline:2px solid var(--phosphor);outline-offset:3px;}
  footer a:focus-visible{outline:2px solid var(--phosphor);outline-offset:2px;}

  footer{
    position:relative;z-index:1;padding:26px 32px;border-top:1px solid var(--line-soft);
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;
    font-family:var(--mono);font-size:11.5px;color:var(--dim);
  }
  footer a{color:var(--muted);text-decoration:none;}
  footer a:hover{color:var(--phosphor);}
</style>
</head>
<body>

<div class="grid-bg"></div>

<main>
  <div class="mark"><span>iR</span><i></i></div>

  <div class="eyebrow">Under construction</div>

  <h1>We're rebuilding the <span class="accent">arteries</span> of inferreach.com.</h1>
  <p class="sub">The site is getting a full rebuild. Same team, same work, better home for it. Back online shortly.</p>

  <div class="status"><span class="live-dot"></span>rebuild in progress</div>

  <div class="contact">
    <a class="btn btn-primary" href="mailto:hello@inferreach.com">Email Us</a>
    <a class="btn btn-ghost" href="https://cal.com/inferreach/30min" target="_blank" rel="noopener noreferrer">Book a Free Audit</a>
  </div>
</main>

<footer>
  <div>© 2026 InferReach</div>
  <div><a href="mailto:hello@inferreach.com">hello@inferreach.com</a></div>
</footer>

</body>
</html>
